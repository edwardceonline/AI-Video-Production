name: EzSites Lemo Director 20s [runner alternative]

on:
  push:
    branches:
      - experiment/lemo-opuscar-native
    paths:
      - ".github/workflows/lemo-opuscar-poc.yml"
      - "films/ezsites-lemo-native/**"
  workflow_dispatch:

concurrency:
  group: lemo-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render 20s Lemo director film
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      LEMO_SHA: b5e8ef93930b6d828f352055a689320f138237b1
      LEMO_LIB: /tmp/lemo-opuscar
    steps:
      - name: Checkout film source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-venv fontconfig
      - name: Obtain pinned upstream Lemo-Opuscar
        run: |
          git init "$LEMO_LIB"
          git -C "$LEMO_LIB" remote add origin https://github.com/lemomo-ai/lemo-opuscar.git
          git -C "$LEMO_LIB" fetch --depth=1 origin "$LEMO_SHA"
          git -C "$LEMO_LIB" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C "$LEMO_LIB" rev-parse HEAD)" = "$LEMO_SHA"
          cd "$LEMO_LIB"
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps voice
      - name: Pin FFmpeg 7 for consistent loudnorm decoding
        run: |
          python3 -m venv /tmp/lemo-ffmpeg-venv
          /tmp/lemo-ffmpeg-venv/bin/pip install -q imageio-ffmpeg==0.6.0
          BIN=$(/tmp/lemo-ffmpeg-venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$BIN" -version | head -1
          "$BIN" -hide_banner -encoders | grep -q libx264
          mkdir -p /tmp/lemo-ffmpeg-bin
          ln -s "$BIN" /tmp/lemo-ffmpeg-bin/ffmpeg
          echo /tmp/lemo-ffmpeg-bin >> "$GITHUB_PATH"
      - name: Render film with original Lemo tools
        run: bash films/ezsites-lemo-native/build.sh
      - name: Check result exists
        run: |
          test -s films/ezsites-lemo-native/out/ezsites-lemo-native.mp4
          test -s films/ezsites-lemo-native/out/poster.jpg
          test -s films/ezsites-lemo-native/out/ezsites-lemo-native.srt
      - name: Upload finished film and proof frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ezsites-lemo-native-20s
          path: |
            films/ezsites-lemo-native/out/ezsites-lemo-native.mp4
            films/ezsites-lemo-native/out/ezsites-lemo-native.srt
            films/ezsites-lemo-native/out/poster.jpg
            films/ezsites-lemo-native/out/contact-sheet.jpg
            films/ezsites-lemo-native/out/TREATMENT.md
            films/ezsites-lemo-native/out/CREDITS
            films/ezsites-lemo-native/out/director-manifest.json
            films/ezsites-lemo-native/out/score.json
            films/ezsites-lemo-native/out/stills/*.jpg
          if-no-files-found: error
          retention-days: 14

  hybrid:
    name: Remotion compositing bridge
    needs: render
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download native Lemo film artifact
        uses: actions/download-artifact@v4
        with:
          name: ezsites-lemo-native-20s
          path: films/ezsites-lemo-native/remotion/public
      - name: Render hybrid composition
        run: |
          set -euo pipefail
          cd films/ezsites-lemo-native/remotion
          mv public/ezsites-lemo-native.mp4 public/ezsites-native.mp4
          npm install --no-audit --no-fund
          mkdir -p out
          npx remotion render src/index.ts EzSitesHybrid out/ezsites-hybrid.mp4 --codec h264 --concurrency 2
      - name: Install FFprobe for hybrid QC
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Inspect Remotion output
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          p=pathlib.Path("films/ezsites-lemo-native/remotion/out/ezsites-hybrid.mp4")
          assert p.is_file() and p.stat().st_size>50000
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration","-of","json",str(p)]))
          v=next(x for x in info['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'24/1')
          assert any(x['codec_type']=='audio' for x in info['streams']),"Remotion lost voice and music"
          assert 19.95<float(info['format']['duration'])<20.08
          print("Remotion native-clip integration PASS",p)
          PY
      - name: Upload Remotion hybrid MP4
        uses: actions/upload-artifact@v4
        with:
          name: ezsites-remotion-hybrid-20s
          path: films/ezsites-lemo-native/remotion/out/ezsites-hybrid.mp4
          if-no-files-found: error
          retention-days: 14

