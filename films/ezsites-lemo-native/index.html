<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EzSites — Your business, online</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f3ed}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="stage"></canvas><script>
'use strict';
// Custom EzSites film; runs through Lemo-Opuscar's unmodified core/render/video.mjs.
const canvas=document.getElementById('stage'), c=canvas.getContext('2d',{alpha:false});
const W=720,H=1280, BG='#F4F3ED', INK='#151515', BLUE='#3152ED', SOFT='#E0E0D9', WHITE='#FFFFFF';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const prog=(t,a,b)=>ease((t-a)/(b-a));
const rect=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)};
function rule(x,y,x2,y2,col=INK,wd=2){c.strokeStyle=col;c.lineWidth=wd;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke()}
function poly(points,color){c.fillStyle=color;c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}
function round(x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function txt(s,x,y,size,col=INK,weight=800){c.fillStyle=col;c.font=weight+' '+size+'px Arial,sans-serif';c.textBaseline='alphabetic';c.textAlign='left';c.fillText(s,x,y)}
function wipeText(s,x,y,size,color,t,a,b){const p=prog(t,a,b);c.save();c.beginPath();c.rect(x-2,y-size*1.19,680,size*1.25);c.clip();txt(s,x,y+(1-p)*size*1.1,size,color);c.restore()}
function base(){rect(0,0,W,H,BG);c.save();c.strokeStyle='#DFDFD7';c.lineWidth=1;for(let x=46;x<W;x+=91)rule(x,0,x,H,'#DFDFD7',.8);for(let y=52;y<H;y+=70)rule(0,y,W,y,'#DFDFD7',.8);c.restore()}
function header(t){rect(56,66,46,6,BLUE);txt('EZSITES   /   YOUR BUSINESS, ONLINE',117,77,16,INK,600);rule(56,104,664,104)}
function footer(num,label){rule(56,1196,664,1196,SOFT);txt(num+'  /  '+label,56,1232,17,INK,600)}
const iso=(x,y,z,ox=360,oy=860,k=1)=>[ox+(x-y)*.866*k,oy+((x+y)*.5-z)*k];
function block(x,y,z,dx,dy,dz,ox,oy,k,top,left,right){
const P=(a,b,h)=>iso(a,b,h,ox,oy,k);
poly([P(x,y+dy,z),P(x+dx,y+dy,z),P(x+dx,y+dy,z+dz),P(x,y+dy,z+dz)],left);
poly([P(x+dx,y,z),P(x+dx,y+dy,z),P(x+dx,y+dy,z+dz),P(x+dx,y,z+dz)],right);
poly([P(x,y,z+dz),P(x+dx,y,z+dz),P(x+dx,y+dy,z+dz),P(x,y+dy,z+dz)],top);
}
function storefront(cx,cy,k=1,t=2){
c.save();c.translate(0,24*(1-prog(t,.5,1.4)));
block(-170,-142,-20,340,284,22,cx,cy,k,'#FDFCF7','#D9D7D0','#BEBEBB');
block(-115,-88,0,230,178,142,cx,cy,k,'#F9F9F4','#DAD9D6','#B9BBC4');
// store's front window and signage are isometric surfaces, not screenshots.
let p=a=>iso(a,90,0,cx,cy,k);
let a=iso(-102,90,98,cx,cy,k),b=iso(105,90,98,cx,cy,k);
let d=iso(105,90,121,cx,cy,k),e=iso(-102,90,121,cx,cy,k);poly([a,b,d,e],BLUE);
let q1=iso(-91,90,15,cx,cy,k),q2=iso(-28,90,15,cx,cy,k),q3=iso(-28,90,87,cx,cy,k),q4=iso(-91,90,87,cx,cy,k);poly([q1,q2,q3,q4],'#8FADFF');
let r1=iso(10,90,15,cx,cy,k),r2=iso(74,90,15,cx,cy,k),r3=iso(74,90,87,cx,cy,k),r4=iso(10,90,87,cx,cy,k);poly([r1,r2,r3,r4],'#8FADFF');
block(-90,-56,142,180,110,8,cx,cy,k,INK,INK,INK);
c.restore();
}
function sceneA(t){base();header(t);
wipeText('YOUR BUSINESS',54,241,66,INK,t,.12,.65);
wipeText('DESERVES',54,339,91,INK,t,.65,1.11);
wipeText('TO BE SEEN.',54,457,100,BLUE,t,1.12,1.61);
storefront(359+8*Math.sin(t*.9),856,1.21+.08*prog(t,1.3,3.1),t);
rule(58,1094,58+603*prog(t,1.6,2.24),1094,INK,2);
txt('FROM LOCAL ROOTS TO MORE POSSIBILITIES',58,1130,18,INK,500);footer('01','YOUR BUSINESS');
}
function browserCard(t){
const p=prog(t,3.35,4.15),y=338+(1-p)*680;
round(61,y,598,745,12,WHITE);c.strokeStyle=INK;c.lineWidth=3;c.strokeRect(61,y,598,745);
rect(63,y+3,594,58,'#E6E8FA');rule(63,y+62,657,y+62,INK,2);
for(let i=0;i<3;i++){c.beginPath();c.fillStyle=i?INK:BLUE;c.arc(89+i*21,y+32,5,0,Math.PI*2);c.fill()}
round(215,y+17,283,30,5,WHITE);txt('yourbusiness.ch',232,y+39,18,'#50566B',500);
c.save();c.beginPath();c.rect(79,y+86,562,315);c.clip();rect(79,y+86,562,315,'#E9EAE4');
storefront(361,y+330,1.1,t);c.restore();
rect(86,y+430,212*prog(t,4.62,5.22),8,BLUE);
txt('YOUR PLACE.',86,y+520,58);txt('YOUR SPACE.',86,y+591,58);
txt('A home for your business online.',89,y+642,22,INK,500);
round(88,y+669,219,48,4,BLUE);txt('GET IN TOUCH',109,y+701,20,WHITE);
}
function sceneB(t){base();header(t);
wipeText('GO ONLINE.',56,246,102,BLUE,t,3.37,4.00);
browserCard(t);footer('02','DISCOVERABLE');
rule(72,1135,72+572*prog(t,5.55,6.40),1135,BLUE,7);
}
function siteIcon(x,y){round(x-47,y-39,94,78,7,WHITE);c.strokeStyle=INK;c.lineWidth=3;c.strokeRect(x-47,y-39,94,78);rect(x-46,y-38,92,17,BLUE);rect(x-29,y-10,63,9,INK);rect(x-29,y+9,46,5,SOFT)}
function domainIcon(x,y){c.strokeStyle=BLUE;c.lineWidth=4;for(let k=0;k<2;k++){c.beginPath();c.ellipse(x,y,k?19:48,48,0,0,Math.PI*2);c.stroke()}rule(x-46,y,x+46,y,BLUE,3);rule(x-40,y-25,x+40,y-25,BLUE,2);rule(x-40,y+25,x+40,y+25,BLUE,2)}
function emailIcon(x,y){round(x-49,y-34,98,68,6,WHITE);c.strokeStyle=BLUE;c.lineWidth=4;c.strokeRect(x-49,y-34,98,68);rule(x-47,y-32,x,y+7,BLUE,3);rule(x,y+7,x+47,y-32,BLUE,3)}
function module(t,y,a,title,sub,icon){
const p=prog(t,a,a+.45);if(p===0)return;
c.save();c.translate(0,(1-p)*190);round(75,y-65,580,160,6,WHITE);c.strokeStyle=INK;c.lineWidth=2;c.strokeRect(75,y-65,580,160);
rect(75,y-65,13,160,BLUE);icon(174,y+17);
txt(title,273,y+9,50);txt(sub,275,y+52,20,INK,500);c.restore();
}
function sceneC(t){base();header(t);
wipeText('ONE BUSINESS.',52,239,82,INK,t,7.20,7.72);
wipeText('ALL CONNECTED.',52,348,78,BLUE,t,7.58,8.02);
rule(59,450,59,450+584*prog(t,7.8,10.6),BLUE,5);
module(t,482,7.4,'WEBSITE','Show customers what you do.',siteIcon);
module(t,705,8.4,'DOMAIN','Give your business a name.',domainIcon);
module(t,928,9.32,'EMAIL','Stay in touch professionally.',emailIcon);
const q=prog(t,8.02,10.65);round(51,450+584*q-8,16,16,8,INK);
round(93,1100,542*prog(t,9.82,10.36),52,3,INK);
if(t>10.34)txt('ONE PLACE TO GROW.',111,1135,32,WHITE);
footer('03','CONNECTED');
}
function sceneD(t){rect(0,0,W,H,BLUE);c.save();c.globalAlpha=.12;for(let x=55;x<W;x+=92)rule(x,0,x,H,WHITE);for(let y=52;y<H;y+=72)rule(0,y,W,y,WHITE);c.restore();
wipeText('EzSites',57,300,152,WHITE,t,11.8,12.5);
rule(59,352,59+590*prog(t,12.30,12.85),352,WHITE,5);
wipeText('GET YOUR',57,520,78,WHITE,t,12.55,12.99);
wipeText('BUSINESS',57,632,100,WHITE,t,12.90,13.35);
wipeText('ONLINE.',57,755,113,WHITE,t,13.25,13.80);
if(t>13.65){rect(59,949,562*prog(t,13.6,14),88,WHITE);txt('START WITH EZSITES',86,1007,34,BLUE)}
txt('WEBSITE   ·   DOMAIN   ·   BUSINESS EMAIL',60,1166,19,WHITE,600);
rule(58,1193,661,1193,WHITE,1.5);txt('YOUR BUSINESS, ONLINE.',59,1234,17,WHITE,500);
}
function transition(t,start,end,previous,next,fromBottom){previous(t);const p=prog(t,start,end);c.save();c.beginPath();if(fromBottom)c.rect(0,H*(1-p),W,H*p);else c.rect(0,0,W,H*p);c.clip();next(t);c.restore()}
window.DUR=15;
window.EV=[{t:.25,type:'type'},{t:.71,type:'type'},{t:1.16,type:'type'},{t:3.4,type:'whoosh'},{t:4.02,type:'clack'},{t:7.18,type:'whoosh'},{t:7.45,type:'clack'},{t:8.45,type:'clack'},{t:9.37,type:'clack'},{t:11.74,type:'whoosh'},{t:12.4,type:'impact'}];
window.render=function(t){
canvas.width=1080;canvas.height=1920;c.setTransform(1.5,0,0,1.5,0,0);
t=clamp(t,0,15);
if(t<3.2)sceneA(t);
else if(t<3.68)transition(t,3.2,3.68,sceneA,sceneB,true);
else if(t<7.06)sceneB(t);
else if(t<7.48)transition(t,7.06,7.48,sceneB,sceneC,false);
else if(t<11.57)sceneC(t);
else if(t<12.02)transition(t,11.57,12.02,sceneC,sceneD,true);
else sceneD(t);
};
window.READY=true;window.render(0);
</script></body></html>
